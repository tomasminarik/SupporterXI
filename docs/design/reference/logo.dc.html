<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SupporterXI logo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0c0e0d}
a{color:#f3f1ea}a:hover{color:#ffffff}
.pill{display:inline-flex;align-items:center;box-sizing:border-box;border-radius:999px;background:#e0372f;border-style:solid;border-color:#ffffff;color:#ffffff;font-family:'Big Shoulders Display',sans-serif;font-weight:800;text-transform:uppercase;line-height:1;white-space:nowrap}
.pill i{flex:none;border-radius:50%;background:#ffffff;color:#c42a23;display:grid;place-items:center}
.disc{flex:none;box-sizing:border-box;border-radius:50%;background:#e0372f;border-style:solid;border-color:#ffffff;color:#ffffff;display:grid;place-items:center}
.cap{font-size:14px;color:#9a9d94;margin-top:12px;text-align:center}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
</style>
</helmet>
<div style="width: 1440px; height: 760px; box-sizing: border-box; background: #0c0e0d; color: #f3f1ea; font-family: Barlow, sans-serif">
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
<symbol id="xi" viewBox="0 0 36 28"><path d="M4 2L18 26M18 2L4 26M31.5 2V26" fill="none" stroke="currentColor" stroke-width="6.5"></path></symbol>
<symbol id="xi-bold" viewBox="0 0 36 28"><path d="M5.5 1L17.5 27M17.5 1L5.5 27M30.5 1V27" fill="none" stroke="currentColor" stroke-width="8.5"></path></symbol>
</svg>

<div style="display: grid; grid-template-columns: 1fr 1fr; height: 300px">
<div style="display: grid; place-items: center; background: #0c0e0d">
<span class="pill" style="height: 112px; border-width: 6px; padding: 0 44px 0 8px; gap: 20px; font-size: 62px"><i style="width: 84px; height: 84px"><svg width="50" height="39"><use href="#xi"></use></svg></i>Supporter</span>
</div>
<div style="display: grid; place-items: center; background: #f3f1ea">
<span class="pill" style="height: 112px; border-width: 6px; border-color: #14160f; padding: 0 44px 0 8px; gap: 20px; font-size: 62px"><i style="width: 84px; height: 84px"><svg width="50" height="39"><use href="#xi"></use></svg></i>Supporter</span>
</div>
</div>

<div style="padding: 44px 48px 0; display: grid; grid-template-columns: 1.5fr 1fr; gap: 48px">
<div>
<div style="font-size: 16px; font-weight: 600; margin-bottom: 20px">Full logo, 32 px and taller</div>
<div style="display: flex; gap: 40px; align-items: flex-end; height: 100px">
<div class="col"><span class="pill" style="height: 64px; border-width: 3px; padding: 0 25px 0 5px; gap: 12px; font-size: 35px"><i style="width: 48px; height: 48px"><svg width="28" height="22"><use href="#xi"></use></svg></i>Supporter</span><div class="cap">64 px</div></div>
<div class="col"><span class="pill" style="height: 48px; border-width: 3px; padding: 0 19px 0 3px; gap: 9px; font-size: 26px"><i style="width: 36px; height: 36px"><svg width="21" height="16"><use href="#xi"></use></svg></i>Supporter</span><div class="cap">48 px</div></div>
<div class="col"><span class="pill" style="height: 32px; border-width: 2px; padding: 0 12px 0 2px; gap: 6px; font-size: 17.5px"><i style="width: 24px; height: 24px"><svg width="14" height="11"><use href="#xi-bold"></use></svg></i>Supporter</span><div class="cap">32 px, smallest</div></div>
</div>
</div>
<div>
<div style="font-size: 16px; font-weight: 600; margin-bottom: 20px">Collapsed mark, any size, and the only form below 32 px</div>
<div style="display: flex; gap: 36px; align-items: flex-end; height: 100px">
<div class="col"><span class="disc" style="width: 64px; height: 64px; border-width: 4px"><svg width="36" height="28"><use href="#xi"></use></svg></span><div class="cap">64 px</div></div>
<div class="col"><span class="disc" style="width: 48px; height: 48px; border-width: 3px"><svg width="27" height="21"><use href="#xi"></use></svg></span><div class="cap">48 px</div></div>
<div class="col"><span class="disc" style="width: 32px; height: 32px; border-width: 2px"><svg width="18" height="14"><use href="#xi-bold"></use></svg></span><div class="cap">32 px</div></div>
<div class="col"><span class="disc" style="width: 24px; height: 24px; border-width: 0"><svg width="15.4" height="12"><use href="#xi-bold"></use></svg></span><div class="cap">24 px</div></div>
<div class="col"><span class="disc" style="width: 16px; height: 16px; border-width: 0"><svg width="10.8" height="8.4"><use href="#xi-bold"></use></svg></span><div class="cap">16 px</div></div>
</div>
</div>
</div>

<div style="padding: 44px 48px 0; display: flex; align-items: center; gap: 28px">
<span class="pill" style="height: 48px; border-width: 3px; padding: 0 3px 0 19px; gap: 9px; font-size: 26px">Supporter<i style="width: 36px; height: 36px"><svg width="21" height="16"><use href="#xi"></use></svg></i></span>
<div><div style="font-size: 16px; font-weight: 600">Alternative order</div><div style="font-size: 14px; color: #b9bcb2; margin-top: 2px">Disc at the end, so it reads "Supporter XI" left to right.</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
